[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Keep credentials in Netlify's environment variables, never in this file.
# SUPABASE_DATABASE_URL must use sslmode=verify-full.
# Set SUPABASE_DATABASE_CA_PEM to certificates/prod-ca-2021.crt with newlines escaped as \n.
